openapi: 3.0.0
info:
  title: DocBranch API
  version: 1.0.0
  description: |
    API for managing resumes and profiles used by the DocBranch project.
    Endpoints allow listing, retrieving, creating/updating and deleting resumes and profiles.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Resumes
    description: Operations related to resumes
  - name: Profiles
    description: Operations related to profiles
paths:
  /:
    get:
      summary: Root
      description: Returns a simple greeting.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /resumes:
    get:
      tags: [Resumes]
      summary: List all resumes
      responses:
        "200":
          description: A list of resumes (DynamoDB scan result)
          content:
            application/json:
              schema:
                type: object
                properties:
                  Items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resume"
                  Count:
                    type: integer
                  ScannedCount:
                    type: integer
    post:
      tags: [Resumes]
      summary: Create or update a resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resume"
      responses:
        "200":
          description: Result of put operation (DynamoDB response)
          content:
            application/json:
              schema:
                type: object

  /resumes/{userid}:
    get:
      tags: [Resumes]
      summary: List resumes for a user
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Query results for the user's resumes
          content:
            application/json:
              schema:
                type: object

  /resumes/{userid}/{resumeid}:
    get:
      tags: [Resumes]
      summary: Get a specific resume by user and resume id
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Resume object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
    put:
      tags: [Resumes]
      summary: Update or create a resume by id
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ResumeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resume"
      responses:
        "200":
          description: Result of put operation
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Resumes]
      summary: Delete a resume
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Delete result (DynamoDB response)
          content:
            application/json:
              schema:
                type: object

  /profiles:
    get:
      tags: [Profiles]
      summary: List all profiles
      responses:
        "200":
          description: A list of profiles (DynamoDB scan result)
          content:
            application/json:
              schema:
                type: object
                properties:
                  Items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
                  Count:
                    type: integer
                  ScannedCount:
                    type: integer
    post:
      tags: [Profiles]
      summary: Create or update a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "200":
          description: Result of put operation
          content:
            application/json:
              schema:
                type: object

  /profiles/{userid}:
    get:
      tags: [Profiles]
      summary: Get profile(s) by user id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Query results for the user's profile
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Profiles]
      summary: Delete a profile by user id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Delete result (DynamoDB response)
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    UserId:
      name: userid
      in: path
      required: true
      schema:
        type: string
    ResumeId:
      name: resumeid
      in: path
      required: true
      schema:
        type: string

  schemas:
    Experience:
      type: object
      properties:
        company:
          type: string
        role:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required: [company, role]

    Resume:
      type: object
      properties:
        user_id:
          type: string
        resume_id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        skills:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
      required: [user_id, resume_id]

    Profile:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        skills:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
      required: [user_id]

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              err:
                type: string
